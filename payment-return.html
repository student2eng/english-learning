<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Payment Verification</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #f5f7fb;
            color: #1f2937;
        }


        .card {
            width: 100%;
            max-width: 480px;

            padding: 40px 30px;

            text-align: center;

            background: #ffffff;

            border-radius: 16px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);
        }


        .icon {
            width: 72px;
            height: 72px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 42px;
        }


        .result-icon {
            width: 72px;
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto;

            font-size: 42px;
            font-weight: 700;
        }


        /* =====================================================
           Spinner
           ===================================================== */

        .spinner {
            width: 42px;
            height: 42px;

            margin: 0 auto;

            border: 4px solid #e5e7eb;
            border-top-color: #111827;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }


        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        h1 {
            margin: 0 0 14px;

            font-size: 28px;
            line-height: 1.3;
        }


        .card p {
            margin: 0;

            font-size: 16px;
            line-height: 1.6;

            color: #4b5563;
        }


        .note {
            margin-top: 18px !important;

            font-size: 14px !important;

            color: #6b7280 !important;
        }


        .action {
            margin-top: 24px;
        }


        .action button {
            width: 100%;

            padding: 13px 20px;

            border: none;
            border-radius: 8px;

            background: #111827;
            color: #ffffff;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition:
                opacity 0.2s ease,
                transform 0.1s ease;
        }


        .action button:hover {
            opacity: 0.9;
        }


        .action button:active {
            transform: scale(0.99);
        }


        .action button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }


        .action a {
            display: inline-block;

            padding: 12px 20px;

            border-radius: 8px;

            background: #111827;
            color: #ffffff;

            text-decoration: none;

            font-size: 15px;
            font-weight: 600;
        }


        footer {
            margin-top: 28px;

            font-size: 13px;

            color: #9ca3af;
        }

    </style>

</head>


<body>


    <div class="card">

        <div class="icon">
            <div class="spinner"></div>
        </div>


        <h1>
            Checking Payment
        </h1>


        <p>
            We are securely verifying your payment.
        </p>


        <p class="note">
            Please wait while our system checks the transaction.
        </p>


        <div class="action"></div>


        <footer>
            English Learning
        </footer>

    </div>



    <!-- =====================================================
         Supabase
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



    <script>

        // =====================================================
        // Supabase Configuration
        // =====================================================

        const SUPABASE_URL =
            "https://azuzgodrxkxhlsekooyc.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_urenPm0k3KqkSpb9aSkVOw_OVYch9mM";


        const {
            createClient
        } = supabase;


        const supabaseClient =
            createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        // =====================================================
        // UI Elements
        // =====================================================

        const card =
            document.querySelector(".card");


        const icon =
            document.querySelector(".icon");


        const title =
            document.querySelector("h1");


        const message =
            document.querySelector(".card p");


        const note =
            document.querySelector(".note");



        // =====================================================
        // Clear Action Area
        // =====================================================

        function clearAction() {

            const action =
                document.querySelector(".action");


            action.innerHTML = "";

        }



        // =====================================================
        // Success
        // =====================================================

        function showSuccess() {

            clearAction();


            icon.innerHTML =
                '<div class="result-icon">✓</div>';


            title.textContent =
                "Payment Successful";


            message.textContent =
                "Your payment has been verified and your subscription is now active.";


            note.textContent =
                "Redirecting you to your Dashboard...";


            setTimeout(
                () => {

                    window.location.replace(
                        "dashboard.html"
                    );

                },
                700
            );

        }



        // =====================================================
        // Recovery
        // =====================================================

        function showRecovery(errorMessage) {

            clearAction();


            icon.innerHTML =
                '<div class="result-icon">!</div>';


            title.textContent =
                "Payment Needs Verification";


            message.textContent =
                errorMessage ||
                "Your payment may have been completed, but we could not finish the verification.";


            note.textContent =
                "Do not make another payment. Retry verification using the same payment.";


            const action =
                document.querySelector(".action");


            const button =
                document.createElement("button");


            button.type =
                "button";


            button.textContent =
                "Retry Verification";


            button.addEventListener(
                "click",
                async () => {

                    button.disabled =
                        true;


                    button.textContent =
                        "Verifying...";


                    // ---------------------------------------------
                    // Get current session
                    // ---------------------------------------------

                    let session;


                    try {

                        const {
                            data,
                            error
                        } =
                            await supabaseClient.auth.getSession();


                        if (error) {
                            throw error;
                        }


                        session =
                            data?.session;


                    } catch (error) {

                        console.error(
                            "Retry session check error:",
                            error
                        );


                        showRecovery(
                            "We could not verify your account session. Please try again."
                        );


                        return;

                    }


                    if (!session?.access_token) {

                        window.location.replace(
                            "auth.html?return_to=payment-return.html&payment_id=" +
                            encodeURIComponent(
                                new URLSearchParams(
                                    window.location.search
                                ).get("payment_id")
                            )
                        );


                        return;

                    }



                    // ---------------------------------------------
                    // Retry verification
                    // ---------------------------------------------

                    const paymentId =
                        new URLSearchParams(
                            window.location.search
                        ).get("payment_id");


                    if (!paymentId) {

                        showError(
                            "No payment reference was found. Please return to the subscription plans."
                        );


                        return;

                    }



                    // ---------------------------------------------
                    // Show checking state
                    // ---------------------------------------------

                    clearAction();


                    icon.innerHTML =
                        '<div class="spinner"></div>';


                    title.textContent =
                        "Checking Payment";


                    message.textContent =
                        "We are securely checking your payment again.";


                    note.textContent =
                        "Please wait while our system verifies the transaction.";



                    // ---------------------------------------------
                    // Verify again
                    // ---------------------------------------------

                    const verificationResult =
                        await verifyPayment(
                            session,
                            paymentId
                        );


                    console.log(
                        "Retry verification result:",
                        verificationResult
                    );


                    const verificationData =
                        verificationResult.data;



                    // ---------------------------------------------
                    // Network / unexpected error
                    // ---------------------------------------------

                    if (
                        verificationResult.error
                    ) {

                        showRecovery(
                            "We could not confirm the verification result. Please retry verification; do not pay again."
                        );


                        return;

                    }



                    // ---------------------------------------------
                    // Success
                    // ---------------------------------------------

                    if (
                        verificationData?.payment_completed === true &&
                        verificationData?.subscription_activated === true
                    ) {

                        showSuccess();


                        return;

                    }



                    // ---------------------------------------------
                    // Recovery
                    // ---------------------------------------------

                    if (
                        verificationData?.recoverable === true
                    ) {

                        showRecovery(
                            verificationData?.error
                        );


                        return;

                    }



                    // ---------------------------------------------
                    // Failure
                    // ---------------------------------------------

                    showError(
                        verificationData?.error
                    );

                }
            );


            action.appendChild(
                button
            );

        }



        // =====================================================
        // Error / Failure
        // =====================================================

        function showError(errorMessage) {

            clearAction();


            icon.innerHTML =
                '<div class="result-icon">×</div>';


            title.textContent =
                "Payment Verification Failed";


            message.textContent =
                errorMessage ||
                "We could not verify your payment.";


            note.textContent =
                "Please return to the Subscription Plans page and try again.";


            const action =
                document.querySelector(".action");


            const link =
                document.createElement("a");


            link.href =
                "subscription-plans.html";


            link.textContent =
                "Back to Subscription Plans";


            action.appendChild(
                link
            );

        }



        // =====================================================
        // Verify Payment
        // =====================================================

        async function verifyPayment(
            session,
            paymentId
        ) {

            let response;


            let data = null;


            try {

                response =
                    await fetch(
                        SUPABASE_URL +
                        "/functions/v1/verify-payment",
                        {
                            method: "POST",

                            headers: {

                                "Authorization":
                                    "Bearer " +
                                    session.access_token,

                                "apikey":
                                    SUPABASE_KEY,

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({
                                    payment_id:
                                        paymentId
                                })
                        }
                    );


                try {

                    data =
                        await response.json();

                } catch {

                    data =
                        null;

                }


                console.log(
                    "verify-payment HTTP status:",
                    response.status
                );


                return {
                    response,
                    data
                };


            } catch (error) {

                console.error(
                    "verify-payment network error:",
                    error
                );


                return {
                    response: null,
                    data: null,
                    error
                };

            }

        }



        // =====================================================
        // Initial Page Load
        // =====================================================

        document.addEventListener(
            "DOMContentLoaded",
            async () => {

                try {

                    // ---------------------------------------------
                    // Get payment ID
                    // ---------------------------------------------

                    const paymentId =
                        new URLSearchParams(
                            window.location.search
                        ).get("payment_id");


                    if (!paymentId) {

                        showError(
                            "No payment reference was found. Please return to the subscription plans."
                        );


                        return;

                    }



                    // ---------------------------------------------
                    // Get current session
                    // ---------------------------------------------

                    const {
                        data,
                        error
                    } =
                        await supabaseClient.auth.getSession();


                    if (error) {
                        throw error;
                    }


                    const session =
                        data?.session;



                    // ---------------------------------------------
                    // No session
                    // ---------------------------------------------

                    if (!session?.access_token) {

                        window.location.replace(
                            "auth.html?return_to=payment-return.html&payment_id=" +
                            encodeURIComponent(
                                paymentId
                            )
                        );


                        return;

                    }



                    // ---------------------------------------------
                    // Verify payment
                    // ---------------------------------------------

                    const verificationResult =
                        await verifyPayment(
                            session,
                            paymentId
                        );


                    console.log(
                        "Initial verification result:",
                        verificationResult
                    );


                    const verificationData =
                        verificationResult.data;



                    // ---------------------------------------------
                    // Network / unexpected error
                    // ---------------------------------------------

                    if (
                        verificationResult.error
                    ) {

                        showRecovery(
                            "We could not confirm the verification result. Please retry verification; do not pay again."
                        );


                        return;

                    }



                    // ---------------------------------------------
                    // Success
                    //
                    // Final success requires BOTH:
                    //
                    // payment_completed === true
                    // subscription_activated === true
                    // ---------------------------------------------

                    if (
                        verificationData?.payment_completed === true &&
                        verificationData?.subscription_activated === true
                    ) {

                        showSuccess();


                        return;

                    }



                    // ---------------------------------------------
                    // Recovery
                    //
                    // Only explicit recoverable === true
                    // enters the recovery flow.
                    // ---------------------------------------------

                    if (
                        verificationData?.recoverable === true
                    ) {

                        showRecovery(
                            verificationData?.error
                        );


                        return;

                    }



                    // ---------------------------------------------
                    // Failure / incomplete payment
                    // ---------------------------------------------

                    showError(
                        verificationData?.error
                    );

                } catch (error) {

                    console.error(
                        "Payment return error:",
                        error
                    );


                    // ---------------------------------------------
                    // Unexpected error
                    //
                    // Do NOT assume that the user is logged out.
                    // Preserve the same payment ID and offer
                    // Recovery instead.
                    // ---------------------------------------------

                    const paymentId =
                        new URLSearchParams(
                            window.location.search
                        ).get("payment_id");


                    if (paymentId) {

                        showRecovery(
                            "We could not complete the payment verification. Please retry verification; do not pay again."
                        );

                    } else {

                        showError(
                            "No payment reference was found. Please return to the subscription plans."
                        );

                    }

                }

            }
        );

    </script>

</body>
</html>
