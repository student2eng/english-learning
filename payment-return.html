<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Return | English Learning</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f7f8fa;
            color: #222;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 20px;
        }

        .header-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #222;
            text-decoration: none;
        }

        .signin {
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 40px 24px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
        }

        .icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            width: 26px;
            height: 26px;
            border: 3px solid #d1d5db;
            border-top-color: #6b7280;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            margin: 0 0 12px;
            font-size: 26px;
        }

        p {
            margin: 0 auto;
            max-width: 420px;
            line-height: 1.7;
            color: #666;
            font-size: 15px;
        }

        .note {
            margin-top: 24px;
            padding: 14px 16px;
            background: #f9fafb;
            border-radius: 10px;
            color: #666;
            font-size: 13px;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            header {
                padding: 16px;
            }

            main {
                padding: 24px 16px;
            }

            .card {
                padding: 32px 20px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-inner">
            <a href="index.html" class="logo">
                English Learning
            </a>

            <a href="auth.html" class="signin">
                Sign In
            </a>
        </div>
    </header>

    <main>
        <section class="card">

            <div class="icon" aria-hidden="true">
                <div class="spinner"></div>
            </div>

            <h1>Checking Payment</h1>

            <p>
                We are securely checking your payment.
                Please wait while our system verifies the transaction.
            </p>

            <div class="note">
                Your subscription will not be activated until the payment has been successfully verified.
            </div>

        </section>
    </main>

    <footer>
        © 2026 English Learning
    </footer>

</body>
</html>
