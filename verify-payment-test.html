<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Payment Test</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
    }

    h1 {
      margin-bottom: 10px;
    }

    button {
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    pre {
      background: #f5f5f5;
      padding: 16px;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>Verify Payment Test</h1>

  <p>
    Temporary test page for verify-payment.
  </p>

  <button id="testButton">
    Test Payment Not Found
  </button>

  <pre id="result">Ready.</pre>

  <script>
    const SUPABASE_URL = "https://azuzgodrxkxhlsekooyc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_urenPm0k3KqkSpb9aSkVOw_OVYch9mM";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const VERIFY_PAYMENT_URL =
      `${SUPABASE_URL}/functions/v1/verify-payment`;

    const result = document.getElementById("result");
    const testButton = document.getElementById("testButton");

    testButton.addEventListener("click", async () => {

      result.textContent = "Checking session...";

      try {

        // ----------------------------------------
        // 1. Get current session
        // ----------------------------------------

        const {
          data: {
            session
          },
          error: sessionError
        } = await supabaseClient.auth.getSession();

        if (sessionError) {
          throw new Error(
            `Session error: ${sessionError.message}`
          );
        }

        if (!session) {
          result.textContent =
            "No active session. Please log in first.";
          return;
        }

        // ----------------------------------------
        // 2. Call verify-payment
        // ----------------------------------------

        result.textContent =
          "Calling verify-payment...";

        const response = await fetch(
          VERIFY_PAYMENT_URL,
          {
            method: "POST",

            headers: {
              "Authorization":
                `Bearer ${session.access_token}`,

              "apikey":
                SUPABASE_KEY,

              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              payment_id:
                "f8a5e9c0-8fea-426c-8427-0e7d7cae655d"
            })
          }
        );

        // ----------------------------------------
        // 3. Read response
        // ----------------------------------------

        const data = await response.json();

        result.textContent =
          `HTTP ${response.status}\n\n` +
          JSON.stringify(data, null, 2);

      } catch (error) {

        console.error(error);

        result.textContent =
          "Test error:\n\n" +
          (error instanceof Error
            ? error.message
            : String(error));
      }
    });
  </script>

</body>
</html>
