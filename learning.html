<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Learning | English Learning</title>

    <meta
        name="description"
        content="Learn English vocabulary with focused word practice and review."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body class="learning-page">

    <!-- Header -->
    <header class="site-header">
        <div class="container header-inner">

            <a href="index.html" class="brand">
                English Learning
            </a>

            <div class="account-menu">

    <button
        type="button"
        class="account-menu-button"
        id="accountMenuButton"
        aria-expanded="false"
        aria-controls="accountMenu"
    >
        Account
        <span class="account-menu-arrow">▼</span>
    </button>

    <div
        class="account-dropdown"
        id="accountMenu"
        hidden
    >

        <button
            type="button"
            class="account-dropdown-item"
            disabled
        >
            Account
        </button>

        <button
            type="button"
            class="account-dropdown-item"
            disabled
        >
            Change Level
        </button>

        <button
            type="button"
            class="account-dropdown-item"
            disabled
        >
            Change Password
        </button>

        <button
            type="button"
            class="account-dropdown-item account-logout"
            id="accountLogoutButton"
        >
            Log Out
        </button>

    </div>

            </div>

        </div>
    </header>


    <!-- Learning Page -->
    <main>

        <div class="container learning-container">

            <!-- Exit Learning -->
            <a href="dashboard.html" class="exit-learning">
                ← Exit Learning
            </a>


            <!-- Learning Heading -->
            <section class="learning-heading">

                <p class="eyebrow">
                    B1 — Intermediate
                </p>

                <h1>
                    English Vocabulary Learning
                </h1>


                <!-- Progress -->
                <div class="learning-progress">

                    <div class="progress-meta">
                        <span id="progressText">
                            Word 1 of 10
                        </span>
                    </div>

                    <div
                        class="progress-track"
                        role="progressbar"
                        aria-valuemin="0"
                        aria-valuemax="10"
                        aria-valuenow="1"
                        aria-label="Learning progress"
                    >
                        <div
                            id="progressBar"
                            class="progress-fill"
                        ></div>
                    </div>

                </div>

            </section>


            <!-- Word Card -->
            <section
                class="word-card"
                id="wordCard"
                aria-live="polite"
            >

                <!-- Word Image -->
                <div class="word-image-wrap">

                    <div
                        class="word-image-placeholder"
                        id="wordImage"
                        aria-label="Word image"
                    >
                        Image
                    </div>

                </div>


                <!-- Word -->
                <h2
                    class="word-title"
                    id="wordText"
                >
                    welcome
                </h2>


                <!-- Listen -->
                <button
                    type="button"
                    class="listen-button"
                    id="listenButton"
                >
                    <span aria-hidden="true">🔊</span>
                    Listen
                </button>


                <!-- Initial Actions -->
                <div
                    class="word-actions"
                    id="initialActions"
                >

                    <button
                        type="button"
                        class="btn btn-secondary"
                        id="dontKnowButton"
                    >
                        I Don't Know
                    </button>

                    <button
                        type="button"
                        class="btn btn-primary"
                        id="knowButton"
                    >
                        I Know ✓
                    </button>

                </div>


                <!-- Meaning + Example -->
                <!-- Hidden until I Don't Know is pressed -->
                <div
                    class="word-reveal"
                    id="wordReveal"
                    hidden
                >

                    <div class="meaning-block">

                        <h3>
                            Meaning
                        </h3>

                        <p id="meaningText"></p>

                    </div>


                    <div class="example-block">

                        <h3>
                            Example
                        </h3>

                        <p id="exampleText"></p>

                    </div>


                    <!-- Got It -->
                    <button
                        type="button"
                        class="btn btn-primary got-it-button"
                        id="gotItButton"
                    >
                        Got It →
                    </button>

                </div>

            </section>

        </div>

    </main>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Learning JavaScript -->
<script src="learning.js"></script>

</body>
    </html>
